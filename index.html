<style>
/* =========================================================
   TOKENS — Fluent-inspired light theme, dezente Blautöne
   ========================================================= */
:root{
  --bg:#F4F6F9;
  --surface:#FFFFFF;
  --surface-alt:#FAFBFD;
  --border:#E3E8EF;
  --border-strong:#D3DAE4;
  --text:#1B2430;
  --text-secondary:#5B6675;
  --text-muted:#8B94A3;

  --blue-50:#EEF4FD;
  --blue-100:#DCEAFB;
  --blue-500:#2564CF;
  --blue-600:#1B54B3;
  --blue-700:#144291;

  --green-50:#EAF7EE;
  --green-600:#1E8A45;
  --green-700:#166636;
  --amber-50:#FFF6E4;
  --amber-600:#B87400;
  --orange-50:#FFEEE5;
  --orange-600:#C4501E;
  --red-50:#FDECEC;
  --red-600:#C42B2B;
  --gray-50:#F1F2F4;
  --gray-600:#6B7280;

  /* Dezente Akzentfarben je Bereich — pastellig, nicht grell */
  --teal-50:#E5F6F5;
  --teal-600:#0D7C74;
  --teal-700:#0A625B;
  --violet-50:#F0ECFB;
  --violet-600:#6D3FCF;
  --violet-700:#5931A8;
  --gold-50:#FBF1DC;
  --gold-600:#A8790C;
  --gold-700:#87600A;
  --rose-50:#FBEAF0;
  --rose-600:#B5296B;
  --rose-700:#8E2055;
  --slate-50:#EEF1F5;
  --slate-600:#4B5768;
  --slate-700:#374151;

  /* Noch eine Stufe dezenter als die -50-Töne — für ganzflächige Seitenhintergründe */
  --blue-25:#F6F9FE;
  --teal-25:#F1FAFA;
  --violet-25:#F8F6FD;
  --gold-25:#FDF8ED;
  --green-25:#F4FBF6;
  --rose-25:#FDF4F7;
  --slate-25:#F6F8FA;

  --radius-sm:6px;
  --radius:10px;
  --radius-lg:14px;
  --shadow-sm:0 1px 2px rgba(20,40,80,.06);
  --shadow:0 4px 16px rgba(20,40,80,.08);
  --shadow-lg:0 12px 32px rgba(20,40,80,.14);

  --sidebar-w:250px;
  --sidebar-w-collapsed:68px;
  --topbar-h:60px;

  --font: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
}

*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button, input, select, textarea{font-family:inherit; font-size:inherit; color:inherit;}
button{cursor:pointer;}
a{color:inherit; text-decoration:none;}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:#C7CFDA; border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

button:focus-visible, [tabindex]:focus-visible, input:focus-visible, select:focus-visible{
  outline:2px solid var(--blue-500); outline-offset:2px;
}

/* =========================================================
   APP SHELL
   ========================================================= */
#app{display:flex; height:100vh; overflow:hidden;}

.sidebar{
  width:var(--sidebar-w);
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex; flex-direction:column;
  flex-shrink:0;
  transition:width .18s ease;
  z-index:40;
}
.sidebar.collapsed{width:var(--sidebar-w-collapsed);}
.sidebar-brand{
  height:var(--topbar-h);
  display:flex; align-items:center; gap:10px;
  padding:0 16px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  white-space:nowrap; overflow:hidden;
}
.brand-mark{
  width:32px; height:32px; border-radius:8px;
  background:linear-gradient(135deg, var(--blue-500), var(--blue-700));
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-weight:700; font-size:14px; flex-shrink:0;
}
.brand-text{font-weight:600; font-size:15px; color:var(--text);}
.brand-sub{font-size:11px; color:var(--text-muted); margin-top:-2px;}

.nav-list{list-style:none; padding:10px; flex:1; overflow-y:auto;}
.nav-item{
  display:flex; align-items:center; gap:12px;
  padding:10px 12px; border-radius:var(--radius-sm);
  color:var(--text-secondary); font-weight:500;
  cursor:pointer; white-space:nowrap; overflow:hidden;
  margin-bottom:2px;
}
.nav-item svg{flex-shrink:0; width:19px; height:19px;}
.nav-item:hover{background:var(--gray-50); color:var(--text);}
.nav-item.active{font-weight:700;}
.sidebar.collapsed .nav-text, .sidebar.collapsed .brand-text, .sidebar.collapsed .brand-sub{display:none;}
.sidebar.collapsed .nav-item{justify-content:center;}
.sidebar.collapsed .sidebar-brand{justify-content:center; padding:0;}

.sidebar-footer{border-top:1px solid var(--border); padding:12px; flex-shrink:0;}
.role-pill{
  display:flex; align-items:center; gap:8px; padding:8px 10px;
  border-radius:var(--radius-sm); background:var(--surface-alt);
  border:1px solid var(--border); font-size:12px; color:var(--text-secondary);
  cursor:pointer;
}
.sidebar.collapsed .role-pill .role-text{display:none;}
.sidebar.collapsed .reset-link-wrap{display:none;}
.sidebar.collapsed .role-pill{justify-content:center;}

.main-col{flex:1; display:flex; flex-direction:column; min-width:0;}

.topbar{
  height:var(--topbar-h); flex-shrink:0;
  background:var(--surface); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:10px; padding:0 20px;
}
.icon-btn{
  width:36px; height:36px; border-radius:var(--radius-sm);
  border:1px solid transparent; background:transparent;
  display:flex; align-items:center; justify-content:center;
  color:var(--text-secondary); flex-shrink:0;
}
.icon-btn:hover{background:var(--gray-50); color:var(--text);}
.icon-btn svg{width:19px; height:19px;}
.icon-btn.spin svg{animation:spin .8s linear infinite;}
@keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

.search-box{flex:1; max-width:420px; position:relative;}
.search-box input{
  width:100%; height:38px; border-radius:var(--radius-sm);
  border:1px solid var(--border); background:var(--surface-alt);
  padding:0 14px 0 38px; outline:none;
}
.search-box input:focus{border-color:var(--blue-500); background:#fff;}
.search-box svg{position:absolute; left:11px; top:10px; width:18px; height:18px; color:var(--text-muted);}
.search-results{
  position:absolute; top:44px; left:0; right:0; background:#fff;
  border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow-lg); max-height:420px; overflow-y:auto; z-index:60;
}
.search-results .sr-group-title{padding:8px 14px 4px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted);}
.sr-item{padding:9px 14px; display:flex; align-items:center; gap:10px; cursor:pointer;}
.sr-item:hover{background:var(--blue-50);}
.sr-item .sr-title{font-weight:600; font-size:13px;}
.sr-item .sr-sub{font-size:12px; color:var(--text-secondary);}
.sr-empty{padding:16px; text-align:center; color:var(--text-muted); font-size:13px;}

.topbar-spacer{flex:1;}
.topbar-right{display:flex; align-items:center; gap:10px;}
.finder-btn{
  display:flex; align-items:center; gap:8px; height:38px; padding:0 14px 0 12px;
  border-radius:var(--radius-sm); border:1px solid var(--border-strong); background:#fff; font-weight:600; font-size:13px;
  color:var(--blue-700); flex-shrink:0;
}
.finder-btn:hover{background:var(--blue-50);}
.finder-btn svg{width:17px; height:17px;}
.user-chip{
  display:flex; align-items:center; gap:8px; padding:6px 10px 6px 6px;
  border-radius:20px; border:1px solid var(--border); cursor:pointer; flex-shrink:0;
}
.avatar{
  width:28px; height:28px; border-radius:50%;
  background:var(--blue-100); color:var(--blue-700);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; flex-shrink:0;
}
.user-chip .uc-name{font-size:13px; font-weight:600;}
.user-chip .uc-role{font-size:11px; color:var(--text-muted);}

.content{flex:1; overflow-y:auto; padding:22px 26px 60px;}
.page-header{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap;}
.page-title{font-size:22px; font-weight:700;}
.page-sub{font-size:13px; color:var(--text-secondary); margin-top:2px;}
.page-actions{display:flex; gap:10px;}

.breadcrumb{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-muted); margin-bottom:8px;}
.breadcrumb .bc-link{cursor:pointer; color:var(--blue-600); font-weight:600;}
.breadcrumb .bc-link:hover{text-decoration:underline;}

.notice{
  display:flex; gap:10px; align-items:flex-start; background:var(--blue-50); border:1px solid var(--blue-100);
  border-radius:var(--radius); padding:12px 14px; font-size:12.5px; color:var(--blue-700); margin-bottom:16px;
}
.notice svg{width:17px; height:17px; flex-shrink:0; margin-top:1px;}

.btn{
  display:inline-flex; align-items:center; gap:8px; height:38px; padding:0 16px;
  border-radius:var(--radius-sm); border:1px solid var(--border-strong);
  background:#fff; font-weight:600; font-size:13px; color:var(--text);
}
.btn svg{width:16px; height:16px;}
.btn:hover{background:var(--gray-50);}
.btn-primary{background:var(--blue-500); border-color:var(--blue-500); color:#fff;}
.btn-primary:hover{background:var(--blue-600); border-color:var(--blue-600);}
.btn-danger{color:var(--red-600); border-color:#F3C6C6;}
.btn-danger:hover{background:var(--red-50);}
.btn-sm{height:32px; padding:0 12px; font-size:12.5px;}
.btn-ghost{border-color:transparent; background:transparent;}
.btn-ghost:hover{background:var(--gray-50);}
.btn[disabled]{opacity:.45; cursor:not-allowed; pointer-events:none;}
.btn-block{width:100%; justify-content:center;}

.grid{display:grid; gap:14px;}
.kpi-grid{grid-template-columns:repeat(auto-fit, minmax(168px,1fr));}
.kpi-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
  padding:16px 18px; box-shadow:var(--shadow-sm); cursor:pointer;
}
.kpi-card:hover{box-shadow:var(--shadow); border-color:var(--border-strong);}
.kpi-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.kpi-icon{width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center;}
.kpi-icon svg{width:18px; height:18px;}
.kpi-value{font-size:26px; font-weight:700; line-height:1;}
.kpi-label{font-size:12.5px; color:var(--text-secondary); margin-top:6px;}

.warn-grid{grid-template-columns:repeat(auto-fit, minmax(230px,1fr)); margin-top:22px;}
.warn-card{
  background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--orange-600);
  border-radius:var(--radius); padding:14px 16px; display:flex; align-items:center; gap:14px; cursor:pointer;
  box-shadow:var(--shadow-sm);
}
.warn-card:hover{box-shadow:var(--shadow);}
.warn-card .wc-num{font-size:22px; font-weight:700; min-width:34px;}
.warn-card .wc-label{font-size:12.5px; color:var(--text-secondary);}

.section-title{font-size:15px; font-weight:700; margin:26px 0 12px;}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm);}
.card-pad{padding:18px 20px;}
.card-header{display:flex; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:1px solid var(--border);}
.card-header h3{font-size:14.5px; font-weight:700;}

.badge{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:700;}
.badge-green{background:var(--green-50); color:var(--green-600);}
.badge-amber{background:var(--amber-50); color:var(--amber-600);}
.badge-orange{background:var(--orange-50); color:var(--orange-600);}
.badge-red{background:var(--red-50); color:var(--red-600);}
.badge-gray{background:var(--gray-50); color:var(--gray-600);}
.badge-blue{background:var(--blue-50); color:var(--blue-700);}
.dot{width:8px; height:8px; border-radius:50%; display:inline-block;}
.dot-green{background:#1E8A45;} .dot-amber{background:#D99A00;} .dot-orange{background:#C4501E;}
.dot-red{background:#C42B2B;} .dot-gray{background:#9AA3AF;}

.toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
.filter-select{
  height:38px; border-radius:var(--radius-sm); border:1px solid var(--border); background:#fff;
  padding:0 10px; min-width:130px;
}
.chip-tabs{display:flex; gap:8px; flex-wrap:wrap;}
.chip-tab{
  padding:7px 14px; border-radius:20px; border:1px solid var(--border); background:#fff;
  font-size:12.5px; font-weight:600; color:var(--text-secondary);
}
.chip-tab.active{background:var(--blue-500); border-color:var(--blue-500); color:#fff;}
.view-toggle{display:flex; border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden;}
.view-toggle button{border:none; background:#fff; height:38px; width:38px; display:flex; align-items:center; justify-content:center; color:var(--text-secondary);}
.view-toggle button.active{background:var(--blue-50); color:var(--blue-700);}

.table-wrap{overflow-x:auto;}
table.data-table{width:100%; border-collapse:collapse; font-size:13px;}
.data-table thead th{
  text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em;
  color:var(--text-muted); padding:10px 14px; border-bottom:1px solid var(--border); white-space:nowrap;
}
.data-table tbody td{padding:12px 14px; border-bottom:1px solid var(--border); vertical-align:middle;}
.data-table tbody tr{cursor:pointer;}
.data-table tbody tr:hover{background:var(--blue-50);}
.cell-strong{font-weight:600;}
.cell-muted{color:var(--text-secondary); font-size:12.5px;}
.id-mono{font-family:'Cascadia Code', Consolas, monospace; font-size:12.5px; color:var(--blue-700); font-weight:700;}

.card-list{display:flex; flex-direction:column; gap:10px;}
.list-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px 16px; display:flex; align-items:center; gap:14px; cursor:pointer;
}
.list-card:hover{box-shadow:var(--shadow); border-color:var(--border-strong);}
.list-card-icon{
  width:42px; height:42px; border-radius:10px; background:var(--blue-50); color:var(--blue-700);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.list-card-icon svg{width:21px; height:21px;}
.list-card-body{flex:1; min-width:0;}
.list-card-title{font-weight:700; font-size:13.5px;}
.list-card-sub{font-size:12px; color:var(--text-secondary); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.list-card-meta{display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex-shrink:0;}

.chk{width:18px; height:18px; accent-color:var(--blue-500);}

.detail-hero{display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap; margin-bottom:20px;}
.device-photo{
  width:120px; height:120px; border-radius:var(--radius-lg); flex-shrink:0;
  background:var(--blue-50); display:flex; align-items:center; justify-content:center; color:var(--blue-600);
  border:1px solid var(--border);
}
.device-photo svg{width:56px; height:56px;}
.detail-hero-main{flex:1; min-width:240px;}
.detail-id{font-family:'Cascadia Code', Consolas, monospace; font-size:22px; font-weight:800; color:var(--blue-700); letter-spacing:.02em;}
.detail-name{font-size:16px; font-weight:600; margin-top:4px;}
.detail-badges{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
.qr-mini{
  width:100px; height:100px; border:1px solid var(--border); border-radius:var(--radius-sm); background:#fff;
  display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer;
}
.qr-mini img, .qr-mini canvas, .qr-mini svg{width:88px; height:88px;}
.detail-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;}

.detail-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:16px;}
.field-list{display:grid; grid-template-columns:1fr 1fr; gap:10px 16px;}
.field-list .fl-item{min-width:0;}
.field-label{font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.03em;}
.field-value{font-size:13.5px; font-weight:600; margin-top:2px; word-break:break-word;}

.timeline{list-style:none; padding:20px 20px 4px;}
.tl-item{position:relative; padding-left:26px; padding-bottom:20px; border-left:2px solid var(--border); margin-left:6px;}
.tl-item:last-child{border-color:transparent; padding-bottom:0;}
.tl-dot{position:absolute; left:-7px; top:0; width:12px; height:12px; border-radius:50%; background:var(--blue-500); border:2px solid #fff; box-shadow:0 0 0 1px var(--border);}
.tl-date{font-size:11.5px; color:var(--text-muted); font-weight:700;}
.tl-title{font-weight:600; font-size:13.5px; margin-top:1px;}
.tl-note{font-size:12.5px; color:var(--text-secondary); margin-top:1px;}

.modal-overlay{
  position:fixed; inset:0; background:rgba(20,30,50,.45); display:flex; align-items:center; justify-content:center;
  z-index:100; padding:20px;
}
.modal{
  background:#fff; border-radius:var(--radius-lg); box-shadow:var(--shadow-lg);
  width:100%; max-width:560px; max-height:88vh; display:flex; flex-direction:column; overflow:hidden;
}
.modal.modal-lg{max-width:760px;}
.modal-header{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border);}
.modal-header h3{font-size:16px; font-weight:700;}
.modal-body{padding:20px; overflow-y:auto;}
.modal-footer{padding:14px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px;}

.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.form-field{display:flex; flex-direction:column; gap:6px;}
.form-field.full{grid-column:1/-1;}
.form-field label{font-size:12px; font-weight:600; color:var(--text-secondary);}
.form-field input, .form-field select, .form-field textarea{
  height:38px; border:1px solid var(--border); border-radius:var(--radius-sm); padding:0 12px; background:#fff;
}
.form-field textarea{height:auto; padding:10px 12px; resize:vertical; min-height:70px;}
.form-field input:focus, .form-field select:focus, .form-field textarea:focus{border-color:var(--blue-500); outline:none;}

.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:#1B2430; color:#fff; padding:12px 20px; border-radius:var(--radius); font-size:13px; font-weight:600;
  box-shadow:var(--shadow-lg); z-index:200; display:flex; align-items:center; gap:10px; max-width:88vw; text-align:center;
}

.empty-state{padding:50px 20px; text-align:center; color:var(--text-muted);}
.empty-state svg{width:44px; height:44px; margin-bottom:10px; opacity:.5;}
.empty-state h4{font-size:14px; color:var(--text); margin-bottom:4px;}

.qr-toolbar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px;}
.qr-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(180px,1fr)); gap:14px;}
.qr-tile{background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:14px; text-align:center; position:relative;}
.qr-tile.selected{border-color:var(--rose-600); box-shadow:0 0 0 2px var(--rose-50);}
.qr-tile .qr-tile-chk{position:absolute; top:10px; left:10px;}
.qr-tile canvas, .qr-tile img, .qr-tile svg{width:96px; height:96px; margin:6px auto;}
.qr-canvas-holder{width:96px; height:96px; margin:6px auto;}

.qr-tile .qt-id{font-family:'Cascadia Code', Consolas, monospace; font-weight:700; font-size:11.5px; color:var(--blue-700);}
.qr-tile .qt-name{font-size:11.5px; color:var(--text-secondary); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

/* ---- Device Finder ---- */
.finder-tabs{display:flex; border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden; margin-bottom:16px;}
.finder-tabs button{flex:1; border:none; background:#fff; height:40px; font-weight:600; font-size:13px; color:var(--text-secondary);}
.finder-tabs button.active{background:var(--blue-50); color:var(--blue-700);}
.finder-code-input{
  width:100%; height:52px; border:1.5px solid var(--border); border-radius:var(--radius); padding:0 16px;
  font-size:18px; font-family:'Cascadia Code', Consolas, monospace; text-transform:uppercase; letter-spacing:.03em;
}
.finder-code-input:focus{border-color:var(--blue-500); outline:none;}
.camera-wrap{position:relative; border-radius:var(--radius); overflow:hidden; background:#111; aspect-ratio:4/3; display:flex; align-items:center; justify-content:center;}
.camera-wrap video{width:100%; height:100%; object-fit:cover;}
.camera-frame{position:absolute; inset:14%; border:3px solid rgba(255,255,255,.85); border-radius:14px; box-shadow:0 0 0 2000px rgba(0,0,0,.25);}
.camera-hint{position:absolute; bottom:10px; left:0; right:0; text-align:center; color:#fff; font-size:12px; font-weight:600; text-shadow:0 1px 3px rgba(0,0,0,.6);}
.camera-placeholder{color:#B9C2CE; text-align:center; padding:20px; font-size:13px;}
.camera-placeholder svg{width:36px; height:36px; margin-bottom:8px; opacity:.7;}
.finder-error{background:var(--red-50); color:var(--red-600); border-radius:var(--radius-sm); padding:10px 14px; font-size:12.5px; margin-top:10px;}

.menu-toggle{display:none;}

@media (max-width: 1080px){ .detail-grid{grid-template-columns:1fr;} }

@media (max-width: 900px){
  .sidebar{position:fixed; left:0; top:0; bottom:0; width:250px; transform:translateX(-100%); box-shadow:var(--shadow-lg);}
  .sidebar.mobile-open{transform:translateX(0);}
  .sidebar.collapsed{width:250px;}
  .sidebar.collapsed .nav-text, .sidebar.collapsed .brand-text, .sidebar.collapsed .brand-sub, .sidebar.collapsed .role-text{display:block;}
  .sidebar.collapsed .nav-item{justify-content:flex-start;}
  .menu-toggle{display:flex;}
  .sidebar-scrim{position:fixed; inset:0; background:rgba(10,15,25,.35); z-index:39;}
  .content{padding:16px;}
  .form-grid{grid-template-columns:1fr;}
  .search-box{max-width:none;}
  .finder-btn .fb-text{display:none;}
}

@media (max-width: 720px){
  .data-table thead{display:none;}
  .data-table, .data-table tbody, .data-table tr, .data-table td{display:block; width:100%;}
  .data-table tr{border:1px solid var(--border); border-radius:var(--radius); margin-bottom:10px; padding:10px 12px; background:#fff;}
  .data-table td{border:none; padding:6px 2px; display:flex; justify-content:space-between; gap:10px; align-items:center;}
  .data-table td[data-label]::before{content:attr(data-label); font-size:11px; color:var(--text-muted); font-weight:700; text-transform:uppercase; letter-spacing:.03em;}
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
}

@media print{
  body *{visibility:hidden;}
  #print-area, #print-area *{visibility:visible;}
  #print-area{display:block !important; position:absolute; left:0; top:0; width:100%;}
  @page{ size:A4; margin:10mm; }
}
#print-area{display:none;}
.label-sheet{display:grid;}
.label-cell{
  border:1px dashed #bbb; border-radius:4px; padding:6px 8px; display:flex; align-items:center; gap:8px;
  page-break-inside:avoid; overflow:hidden;
}
.label-cell canvas, .label-cell img, .label-cell svg{flex-shrink:0;}
.label-text{min-width:0;}
.label-text .lt-brand{font-size:9px; font-weight:700; color:#144291; letter-spacing:.04em;}
.label-text .lt-id{font-family:'Cascadia Code', Consolas, monospace; font-weight:800; font-size:11px;}
.label-text .lt-name{font-size:9px; color:#444; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
</style>

const TODAY = new Date();
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(str){ if(!str) return '—'; const dt=new Date(str); if(isNaN(dt)) return '—'; return dt.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function fmtMoney(n){ if(n==null || n==='' || isNaN(n)) return '—'; return Number(n).toLocaleString('de-DE',{style:'currency',currency:'EUR'}); }
function addYears(dateStr, years){ const dt=new Date(dateStr); dt.setFullYear(dt.getFullYear()+years); return dt.toISOString().slice(0,10); }
function addMonths(dateStr, months){ const dt=new Date(dateStr); dt.setMonth(dt.getMonth()+months); return dt.toISOString().slice(0,10); }
function daysUntil(dateStr){ if(!dateStr) return null; const dt=new Date(dateStr); return Math.round((dt-TODAY)/86400000); }
function escapeHtml(str){ return String(str==null?'':str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  storageBucket: "tepm-it-tool.firebasestorage.app",
  messagingSenderId: "336382061364",
  appId: "1:336382061364:web:bcd1247b637c78a4751361",
};
const CLOUD_DOC_PATH = {collection:'tepm-it-portal', doc:'shared-data'};
let cloudEnabled = false;
let cloudDocRef = null;
let cloudPushTimer = null;
let lastAppliedSnapshot = null;
let cloudStatusReason = 'Noch nicht verbunden…';

function cloudConfigured(){
  return CLOUD_CONFIG.apiKey && CLOUD_CONFIG.apiKey.indexOf('DEIN-') !== 0;
}
let cloudInitAttempts = 0;
function initCloud(){
  if(!cloudConfigured()){ cloudStatusReason = 'Cloud-Speicher ist nicht konfiguriert.'; render(); return; }
  if(typeof firebase === 'undefined'){
    if(!window.__firebaseLoadFailed && cloudInitAttempts < 20){
      // Bibliothek lädt im Hintergrund noch (nicht blockierend) — automatisch weiter versuchen, ohne die Seite zu blockieren
      cloudInitAttempts++;
      cloudStatusReason = 'Verbinde…';
      setTimeout(initCloud, 250);
      return;
    }
    cloudStatusReason = window.__firebaseLoadFailed
      ? 'Die Firebase-Bibliothek konnte nicht geladen werden — vermutlich blockiert das Netzwerk (WLAN/Firewall) die Adresse gstatic.com. Versuch es über Mobilfunkdaten statt WLAN.'
      : 'Die Firebase-Bibliothek konnte nicht rechtzeitig geladen werden (Netzwerk sehr langsam?).';
    render();
    return;
  }
  try{
    firebase.initializeApp(CLOUD_CONFIG);
    const db = firebase.firestore();
    cloudDocRef = db.collection(CLOUD_DOC_PATH.collection).doc(CLOUD_DOC_PATH.doc);
    cloudDocRef.onSnapshot(function(snap){
      const wasEnabled = cloudEnabled;
      cloudEnabled = true;
      cloudStatusReason = 'Verbunden.';
      if(!snap.exists) { if(!wasEnabled) render(); return; }
      const data = snap.data();
      const incoming = JSON.stringify(data);
      if(incoming === lastAppliedSnapshot) { if(!wasEnabled) render(); return; } // eigene Änderung — nichts Neues, kein Neuzeichnen nötig (verhindert offene Fenster/Dropdowns beim Tippen zu unterbrechen)
      lastAppliedSnapshot = incoming;
      lastLocalSnapshot = incoming; // verhindert, dass wir das gerade Empfangene gleich wieder zurückschreiben
      if(Array.isArray(data.users)) USERS = data.users;
      if(Array.isArray(data.devices)) DEVICES = data.devices;
      if(Array.isArray(data.licenses)) LICENSES = data.licenses;
      if(Array.isArray(data.procurement)) PROCUREMENT = data.procurement;
      if(data.categoryLists) CATEGORY_LISTS = data.categoryLists;
      render();
      showToast('Daten wurden aus der Cloud aktualisiert.');
    }, function(err){
      cloudEnabled = false;
      cloudStatusReason = 'Verbindungsfehler: '+(err.code||'')+' '+(err.message||err);
      console.warn('Cloud-Synchronisierung gestört', err);
      render();
    });
  }catch(e){
    cloudEnabled = false;
    cloudStatusReason = 'Fehler beim Verbindungsaufbau: '+e.message;
    console.warn('Cloud-Initialisierung fehlgeschlagen', e);
    render();
  }
}
function retryCloudInit(){
  cloudInitAttempts = 0;
  cloudStatusReason = 'Verbindungsversuch läuft…';
  render();
  setTimeout(initCloud, 50);
}
let refreshInProgress = false;
function forceRefresh(){
  if(refreshInProgress) return;
  refreshInProgress = true;
  render();
  if(cloudEnabled && cloudDocRef){
    cloudDocRef.get({source:'server'}).then(function(snap){
      refreshInProgress = false;
      if(snap.exists){
        const data = snap.data();
        const incoming = JSON.stringify(data);
        lastAppliedSnapshot = incoming;
        lastLocalSnapshot = incoming;
        if(Array.isArray(data.users)) USERS = data.users;
        if(Array.isArray(data.devices)) DEVICES = data.devices;
        if(Array.isArray(data.licenses)) LICENSES = data.licenses;
        if(Array.isArray(data.procurement)) PROCUREMENT = data.procurement;
        if(data.categoryLists) CATEGORY_LISTS = data.categoryLists;
      }
      render();
      showToast('Aktualisiert.');
    }).catch(function(err){
      refreshInProgress = false;
      console.warn('Aktualisierung fehlgeschlagen', err);
      render();
      showToast('Aktualisierung fehlgeschlagen — zeige lokalen Stand.');
    });
  } else {
    // Kein Cloud-Speicher aktiv: einfach die Ansicht (inkl. Filter/Sortierung) neu aufbauen
    refreshInProgress = false;
    render();
    showToast('Aktualisiert.');
  }
}
function pushToCloud(dataObj){
  if(!cloudEnabled || !cloudDocRef) return;
  clearTimeout(cloudPushTimer);
  cloudPushTimer = setTimeout(()=>{
    const snap = JSON.stringify(dataObj);
    lastAppliedSnapshot = snap;
    cloudDocRef.set(dataObj).catch(err=> console.warn('Cloud-Speichern fehlgeschlagen', err));
  }, 500);
}

let lastLocalSnapshot = null;
function currentDataObject(){
  return {users:USERS, devices:DEVICES, licenses:LICENSES, procurement:PROCUREMENT, categoryLists:CATEGORY_LISTS};
}
function loadPersistedData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const saved = JSON.parse(raw);
    if(Array.isArray(saved.users)) USERS = saved.users;
    if(Array.isArray(saved.devices)) DEVICES = saved.devices;
    if(Array.isArray(saved.licenses)) LICENSES = saved.licenses;
    if(Array.isArray(saved.procurement)) PROCUREMENT = saved.procurement;
    if(saved.categoryLists) CATEGORY_LISTS = saved.categoryLists;
  }catch(e){
    console.warn('Gespeicherte Daten konnten nicht geladen werden', e);
  }
}
function savePersistedData(){
  const dataObj = currentDataObject();
  const snap = JSON.stringify(dataObj);
  if(snap === lastLocalSnapshot) return; // nichts hat sich geändert — nichts zu tun
  lastLocalSnapshot = snap;
  if(storageAvailable){
    try{ localStorage.setItem(STORAGE_KEY, snap); }
    catch(e){ storageAvailable = false; console.warn('Daten konnten nicht lokal gespeichert werden', e); }
  }
  pushToCloud(dataObj);
}
function resetToSeedData(){
  if(!confirm('Wirklich alle lokal gespeicherten Änderungen verwerfen und auf die ursprünglich importierten Daten zurücksetzen? Das kann nicht rückgängig gemacht werden.')) return;
  USERS = JSON.parse(JSON.stringify(SEED_USERS));
  DEVICES = JSON.parse(JSON.stringify(SEED_DEVICES));
  LICENSES = JSON.parse(JSON.stringify(SEED_LICENSES));
  PROCUREMENT = JSON.parse(JSON.stringify(SEED_PROCUREMENT));
  CATEGORY_LISTS = JSON.parse(JSON.stringify(SEED_CATEGORY_LISTS));
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  closeModal();

  goTo('dashboard');

/* =========================================================

   ========================================================= */
function ampelForDevice(dev){
  if(dev.noReplacementNeeded){
    return {level:'none', label:'Kein Austausch mehr nötig', dot:'dot-gray', badge:'badge-gray', suppressed:true};
  }
  if(dev.status==='Ausgemustert' || dev.status==='Entsorgt'){
    return {level:'retired', label:'Kein Austausch (Gerät ausgemustert)', dot:'dot-gray', badge:'badge-gray', suppressed:true};
  }
  if(!dev.issuedDate || !dev.replacementPlanned) return {level:'gray', label:'Kein Ausgabedatum', dot:'dot-gray', badge:'badge-gray'};
  const days = daysUntil(dev.replacementPlanned);
  // Austausch ist grundsätzlich erst AB Erreichen von 4 Jahren zulässig (bzw. dem manuell
  // verschobenen Datum) — die Farbstufen darunter sind reine Vorankündigungen, noch NICHT erlaubt.
  if(days <= 0) return {level:'red', label:'Austausch ab jetzt zulässig', dot:'dot-red', badge:'badge-red'};
  if(days <= 60) return {level:'orange', label:'Noch nicht zulässig — in unter 60 Tagen möglich', dot:'dot-orange', badge:'badge-orange'};
  if(days <= 365) return {level:'amber', label:'Noch nicht zulässig — in unter 12 Monaten möglich', dot:'dot-amber', badge:'badge-amber'};
  return {level:'green', label:'Noch nicht zulässig (über 12 Monate entfernt)', dot:'dot-green', badge:'badge-green'};
}
function statusBadgeClass(status){
  const map = {'Im Einsatz':'badge-blue','Im Lager':'badge-gray','Bestellt':'badge-gray','Geliefert':'badge-gray','Ersatzgerät':'badge-blue','Reparatur':'badge-amber','Defekt':'badge-red','Verloren':'badge-red','Ausgemustert':'badge-gray','Entsorgt':'badge-gray'};
  return map[status] || 'badge-gray';
}
function userStatusBadge(status){
  const map = {'Aktiv':'badge-green','Beurlaubt':'badge-amber','Elternzeit':'badge-amber','Ausgeschieden':'badge-gray','Siehe Kommentar':'badge-gray'};
  return map[status] || 'badge-gray';
}
function userById(id){ return USERS.find(u=>u.id===id); }
function deviceById(id){ return DEVICES.find(dv=>dv.id===id); }
function devicesForUser(userId){ return DEVICES.filter(dv=>dv.userId===userId); }
function sortedAlpha(arr){ return [...arr].sort((a,b)=> String(a).localeCompare(String(b), 'de', {sensitivity:'base'})); }
function sortedByName(list, key){ key = key || 'name'; return [...list].sort((a,b)=> String(a[key]).localeCompare(String(b[key]), 'de', {sensitivity:'base'})); }
function pageIconBadge(view, iconName){
  const color = SECTION_COLORS[view] || 'blue';
  return `<div style="width:42px; height:42px; border-radius:12px; background:var(--${color}-50); color:var(--${color}-600); display:flex; align-items:center; justify-content:center; flex-shrink:0;">${icon(iconName)}</div>`;
}

/* ---- Generisches Sortieren für Tabellen ---- */
function toggleSort(view, key){
  const s = state.sort[view];
  if(s.key === key){ s.dir = s.dir === 'asc' ? 'desc' : 'asc'; }
  else { s.key = key; s.dir = 'asc'; }
  render();
}
function sortIndicator(view, key){
  const s = state.sort[view];
  if(s.key !== key) return '';
  return `<span style="font-size:10px; margin-left:3px;">${s.dir==='asc' ? '▲' : '▼'}</span>`;
}
function sortableTh(view, key, label){
  return `<th style="cursor:pointer; user-select:none; white-space:nowrap;" onclick="toggleSort('${view}','${key}')">${label}${sortIndicator(view,key)}</th>`;
}
function applySort(list, view, accessor){
  const s = state.sort[view];
  const sorted = [...list].sort((a,b)=>{
    let av = accessor(a, s.key), bv = accessor(b, s.key);
    if(typeof av === 'string') av = av.toLowerCase();
    if(typeof bv === 'string') bv = bv.toLowerCase();
    if(av == null) av = '';
    if(bv == null) bv = '';
    if(av < bv) return s.dir === 'asc' ? -1 : 1;
    if(av > bv) return s.dir === 'asc' ? 1 : -1;
    return 0;
  });
  return sorted;
}

    case 'id': return dv.id;

    case 'type': return dv.type;
    case 'status': return dv.status;
    case 'userName': return dv.userName || '';
    case 'issuedDate': return dv.issuedDate || '';
    case 'replacement': return dv.replacementPlanned || '';
    default: return '';
  }
}
function filteredDevices(){
  const f = state.deviceFilter;
  const q = f.query.trim().toLowerCase();
  const filtered = DEVICES.filter(dv=>{
    if(f.status!=='alle' && dv.status!==f.status) return false;
    if(f.type!=='alle' && dv.type!==f.type) return false;
    if(q && !(dv.id.toLowerCase().includes(q) || dv.name.toLowerCase().includes(q) || (dv.userName||'').toLowerCase().includes(q))) return false;
    return true;
  });
  return applySort(filtered, 'devices', deviceSortValue);
}

/* ---- QR-Rendering (SVG, komplett offline via eingebettete Bibliothek) ---- */
function deviceQrText(id){ return location.origin + '/geraete/' + id; }
function renderQrSvgIntoEl(el, text){
  if(!el) return;
  if(!window.QRCodeLib || !window.QRCodeLib.toString){
    el.innerHTML = '<div class="cell-muted" style="font-size:10px; padding:6px; text-align:center;">QR-Bibliothek nicht geladen</div>';
    return;
  }
  window.QRCodeLib.toString(text, {type:'svg', margin:1, errorCorrectionLevel:'M'}).then(svg=>{
    el.innerHTML = svg;
    const svgEl = el.querySelector('svg');
    if(svgEl){ svgEl.style.width='100%'; svgEl.style.height='100%'; svgEl.style.display='block'; }
  }).catch(err=>{
    el.innerHTML = '<div class="cell-muted" style="font-size:10px; padding:6px; text-align:center;">QR-Code konnte nicht erzeugt werden</div>';
    console.error('QR-Fehler', err);
  });
}
function renderQrSvgInto(elId, text){ renderQrSvgIntoEl(document.getElementById(elId), text); }

/* ---- E-Mail zu einem Gerät verfassen (öffnet den Standard-Mail-Client, z. B. Outlook) ---- */
const IT_SUPPORT_EMAIL = 'IT@te-pm.de';
function buildMailto(to, cc, subject, body){
  const parts = [];
  if(cc) parts.push('cc='+encodeURIComponent(cc));
  parts.push('subject='+encodeURIComponent(subject));
  parts.push('body='+encodeURIComponent(body));
  return 'mailto:'+(to||'')+'?'+parts.join('&');
}
function composeDeviceEmail(id){
  const dv = deviceById(id);
  const usr = dv.userId ? userById(dv.userId) : null;
  const toEmail = (usr && usr.email) ? usr.email : '';
  const subject = 'IT-Gerät '+dv.id+' – '+dv.name;
  const lines = [
    'Gerätedaten:',
    '',
    'Inventar-ID: '+dv.id,
    'Gerät: '+dv.name,
    'Typ: '+dv.type,
    'Marke: '+dv.brand,
    'Modell: '+dv.model,
    'Seriennummer: '+(dv.serial || '—'),
    'Status: '+dv.status,
    'Standort: '+(dv.location || '—'),
    'Ausgegeben am: '+(dv.issuedDate ? fmtDate(dv.issuedDate) : '—'),
    'Austausch vorgesehen: '+(dv.replacementPlanned ? fmtDate(dv.replacementPlanned) : '—'),
    '',
  ];
  if(!usr){
    lines.push('Hinweis: Für dieses Gerät ist aktuell keine Person zugewiesen.');
  } else if(!usr.email){
    lines.push('Hinweis: Für '+usr.name+' ist keine E-Mail-Adresse hinterlegt — bitte manuell eintragen.');
  }
  const body = lines.join('\n');
  if(!toEmail){ showToast(usr ? 'Für '+usr.name+' ist keine E-Mail-Adresse hinterlegt — bitte im Mail-Programm ergänzen.' : 'Kein Benutzer zugewiesen — bitte Empfänger im Mail-Programm ergänzen.'); }
  window.location.href = buildMailto(toEmail, IT_SUPPORT_EMAIL, subject, body);
}

/* ---- Device edit modal ---- */
function openDeviceEditModal(id){ state.modal = {type:'device-edit', payload:{id}}; render(); }
function nextDeviceId(){
  const used = new Set(DEVICES.map(d=>parseInt(d.id.split('-')[2],10)));
  let n = 1;
  while(used.has(n)) n++;
  return 'TEPM-IT-'+String(n).padStart(6,'0');
}
function saveDeviceEdit(id){
  const g = key=>document.getElementById('de-'+key);
  const isNew = !id;
  let dv = isNew ? null : deviceById(id);
  const type = g('type').value;
  const status = g('status').value;
  const userIdVal = g('user').value;
  const usr = userIdVal ? userById(userIdVal) : null;
  if(isNew){
    const newId = nextDeviceId();
    dv = {id:newId, comments:[], history:[{date:todayStr(), event:'inventarisiert', note:'Gerät angelegt'}]};
    DEVICES.push(dv);
  }
  dv.type = type; dv.brand=g('brand').value; dv.model=g('model').value;
  dv.name = dv.brand+' '+dv.model; dv.title = dv.name;
  dv.serial=g('serial').value || null; dv.status=status;
  dv.userId = usr ? usr.id : null; dv.userName = usr ? usr.name : null;
  dv.location=g('location').value || null; dv.supplier=g('supplier').value || null;
  dv.price=g('price').value ? parseFloat(g('price').value) : null;
  dv.warrantyUntil=g('warranty').value||null;
  dv.orderDate=g('orderDate').value||null;
  dv.deliveryDate=g('deliveryDate').value||null;
  dv.issuedDate=g('issuedDate').value||null;
  dv.replacementPlanned = dv.issuedDate ? addYears(dv.issuedDate,4) : null;
  const newComment = (g('comment').value || '').trim();
  if(newComment){ dv.comments = dv.comments || []; dv.comments.unshift({date: todayStr(), text: newComment}); }
  closeModal();
  showToast(isNew? 'Gerät wurde angelegt.' : 'Änderungen wurden gespeichert.');
  state.view='devices'; state.currentDeviceId=dv.id;
  render();
}

/* ---- Austausch verschieben ---- */
function openPostponeModal(id){ state.modal={type:'postpone', payload:{id}}; render(); }
function computePostponeResult(dv){
  const fixedInput = document.getElementById('postpone-fixed-date');
  const fixedDate = fixedInput && fixedInput.value ? fixedInput.value : null;
  if(fixedDate) return {newDate: fixedDate, viaFixedDate: true};
  const monthsSelect = document.getElementById('postpone-months');
  const months = monthsSelect ? parseInt(monthsSelect.value, 10) : null;
  const base = dv.replacementPlanned || addYears(dv.issuedDate, 4);
  return {newDate: months!=null ? addMonths(base, months) : null, months, viaFixedDate: false};
}
function updatePostponePreview(id){
  const dv = deviceById(id);
  const holder = document.getElementById('postpone-preview');
  if(!dv || !holder) return;
  const result = computePostponeResult(dv);
  if(!result.newDate){ holder.innerHTML = ''; return; }
  holder.innerHTML = `
    <div class="cell-muted" style="font-size:11px; text-transform:uppercase; letter-spacing:.03em; font-weight:700;">Neu geplantes Austauschdatum</div>
    <div style="font-size:22px; font-weight:800; color:var(--blue-700); margin-top:4px;">${fmtDate(result.newDate)}</div>
    ${result.viaFixedDate ? `<div class="cell-muted" style="font-size:12px; margin-top:2px;">Festes Datum</div>` : `<div class="cell-muted" style="font-size:12px; margin-top:2px;">Ausgehend vom aktuellen Austauschdatum + ${result.months} Monate</div>`}
  `;
}
function confirmPostpone(id){
  const dv = deviceById(id);
  const result = computePostponeResult(dv);
  if(!result.newDate){ showToast('Bitte einen Zeitraum oder ein Datum wählen.'); return; }
  const newDate = result.newDate;
  const note = result.viaFixedDate
    ? 'Auf festes Datum gesetzt: '+fmtDate(newDate)
    : 'Um '+result.months+' Monate verschoben — neues Datum: '+fmtDate(newDate);
  dv.replacementPlanned = newDate;
  dv.replacementManuallyAdjusted = true;
  dv.history.push({date:todayStr(), event:'Austausch verschoben', note});
  closeModal();
  showToast('Austausch wurde auf '+fmtDate(newDate)+' verschoben.');
  render();
}
function resetPostpone(id){
  const dv = deviceById(id);
  const standard = dv.issuedDate ? addYears(dv.issuedDate, 4) : null;
  dv.replacementPlanned = standard;
  dv.replacementManuallyAdjusted = false;
  dv.history.push({date:todayStr(), event:'Verschiebung zurückgesetzt', note:'Austauschdatum wieder auf Standard gesetzt: '+fmtDate(standard)});
  showToast('Zurückgesetzt auf Standard: '+fmtDate(standard));
  render();
}

/* ---- Kommentar-Historie ---- */
function addDeviceComment(id){
  const input = document.getElementById('quick-comment-input');
  const text = input ? input.value.trim() : '';
  if(!text){ showToast('Bitte einen Kommentartext eingeben.'); return; }
  const dv = deviceById(id);
  dv.comments = dv.comments || [];
  dv.comments.unshift({date: todayStr(), text});
  showToast('Kommentar gespeichert.');
  render();
}

/* ---- "Kein Austausch mehr nötig" — unabhängig vom Ausmustern ---- */
function toggleNoReplacementNeeded(id){
  const dv = deviceById(id);
  dv.noReplacementNeeded = !dv.noReplacementNeeded;
  dv.history.push({
    date: todayStr(),
    event: dv.noReplacementNeeded ? 'Kein Austausch mehr nötig markiert' : 'Austauschplanung reaktiviert',

function openAssignLicensesModal(userId){ state.modal={type:'assign-licenses', payload:{userId}}; render(); }
function addAssignedLicense(userId, software){
  if(!software) return;
  const u = userById(userId);
  const current = (u.assignedLicensesRaw||'').split(',').map(s=>s.trim()).filter(Boolean);
  if(!current.includes(software)) current.push(software);
  u.assignedLicensesRaw = current.join(', ');
  render();
}
function removeAssignedLicense(userId, software){
  const u = userById(userId);
  const current = (u.assignedLicensesRaw||'').split(',').map(s=>s.trim()).filter(Boolean);
  const updated = current.filter(s=>s!==software);
  u.assignedLicensesRaw = updated.length ? updated.join(', ') : null;
  render();
}

function openUserEditModal(id){ state.modal={type:'user-edit', payload:{id}}; render(); }
function suggestInitials(name){
  const parts = name.trim().split(/\s+/).filter(Boolean);
  let base = parts.map(p=>p[0]).join('').toUpperCase();
  if(!base) return '';
  let candidate = base, n=1;
  while(USERS.some(u=>u.id===candidate)){ n++; candidate = base+n; }
  return candidate;
}
function saveUserEdit(id){
  const g = key=>document.getElementById('ue-'+key);
  const isNew = !id;
  const name = g('name').value.trim();
  if(!name){ showToast('Bitte einen Namen eingeben.'); return; }
  let initials = g('initials').value.trim();
  if(!initials) initials = suggestInitials(name);
  const email = g('email').value.trim() || null;
  if(isNew){
    let candidate = initials, n=1;
    while(USERS.some(u=>u.id===candidate)){ n++; candidate = initials+n; }
    const u = {
      id: candidate, name, initials: candidate,
      department: g('department').value.trim() || '—',
      status: g('status').value,
      email,
      comment: g('comment').value || null,
      assignedLicensesRaw: null,
    };
    USERS.push(u);
    closeModal();
    showToast('Mitarbeiter/in wurde angelegt.');
    state.view='users'; state.currentUserId=u.id;
  } else {
    const u = userById(id);
    u.name = name; u.initials = initials;
    u.department = g('department').value.trim() || '—';
    u.status = g('status').value;
    u.email = email;
    u.comment = g('comment').value || null;
    // Gerätezuordnungen (userName) an neuen Namen anpassen
    DEVICES.forEach(dv=>{ if(dv.userId===u.id) dv.userName = u.name; });
    closeModal();
    showToast('Änderungen wurden gespeichert.');
  }
  render();
}
function setUserStatus(id, status){
  const u = userById(id);
  u.status = status;
  showToast('Status geändert zu: '+status);
  render();
}
function openUserDeleteModal(id){ state.modal={type:'user-delete', payload:{id}}; render(); }
function confirmUserDelete(id){
  const idx = USERS.findIndex(u=>u.id===id);
  if(idx>-1) USERS.splice(idx,1);
  DEVICES.forEach(dv=>{ if(dv.userId===id){ dv.userId=null; dv.userName=null; } });
  closeModal();
  showToast('Mitarbeiter/in wurde gelöscht.');
  goBack();
}

/* ---- Fertige Etikettenbilder (PNG) als ZIP — direkt in DYMO Connect als Bild einfügbar ---- */
function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight, maxLines){
  const words = String(text).split(' ');
  let line = '', lines = 0;
  for(let i=0;i<words.length;i++){
    const test = line + words[i] + ' ';
    if(ctx.measureText(test).width > maxWidth && line){
      ctx.fillText(line.trim(), x, y);
      line = words[i]+' '; y += lineHeight; lines++;
      if(maxLines && lines>=maxLines-1){ 
        const rest = words.slice(i+1).join(' ');
        ctx.fillText((line+rest).trim(), x, y);
        return;
      }
    } else { line = test; }
  }
  ctx.fillText(line.trim(), x, y);
}
function renderDeviceLabelPng(dv){
  return new Promise((resolve, reject)=>{
    if(!window.QRCodeLib || !window.QRCodeLib.toString){ reject(new Error('QR-Bibliothek nicht verfügbar')); return; }
    window.QRCodeLib.toString(deviceQrText(dv.id), {type:'svg', margin:0, errorCorrectionLevel:'M'}).then(svgStr=>{
      // Explizite width/height ergänzen (nur viewBox reicht nicht überall zuverlässig beim Rastern)
      if(!/\swidth=/.test(svgStr)){ svgStr = svgStr.replace('<svg ', '<svg width="512" height="512" '); }
      const svgBlob = new Blob([svgStr], {type:'image/svg+xml'});
      const svgUrl = URL.createObjectURL(svgBlob);
      const img = new Image();
      img.onload = function(){
        try{
          const H = 400, W = 860;
          const canvas = document.createElement('canvas');
          canvas.width = W; canvas.height = H;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,W,H);
          const qrSize = H - 48;
          ctx.drawImage(img, 24, 24, qrSize, qrSize);
          URL.revokeObjectURL(svgUrl);
          const textX = 24 + qrSize + 36;
          const maxTextWidth = W - textX - 24;
          ctx.fillStyle = '#144291';
          ctx.font = 'bold 28px Arial, sans-serif';
          ctx.fillText('TePm Inventar', textX, 74);
          ctx.fillStyle = '#1B2430';
          ctx.font = 'bold 40px "Cascadia Code", Consolas, monospace';
          ctx.fillText(dv.id, textX, 132);
          ctx.fillStyle = '#444C57';
          ctx.font = '26px Arial, sans-serif';
          wrapCanvasText(ctx, dv.type+' · '+dv.brand+' '+dv.model, textX, 178, maxTextWidth, 34, 3);
          canvas.toBlob(function(blob){
            if(blob) resolve(blob); else reject(new Error('toBlob fehlgeschlagen'));
          }, 'image/png');
        }catch(e){ reject(e); }
      };
      img.onerror = function(){ URL.revokeObjectURL(svgUrl); reject(new Error('QR-SVG konnte nicht als Bild geladen werden')); };
      img.src = svgUrl;
    }).catch(reject);
  });
}
async function exportDymoImages(){
  if(!window.JSZip){ showToast('ZIP-Bibliothek nicht verfügbar.'); return; }
  const ids = state.qrSelected.size>0 ? Array.from(state.qrSelected) : filteredQrDevices().map(d=>d.id);
  showToast('Erzeuge '+ids.length+' Etikettenbild(er)…');
  const zip = new JSZip();
  let ok = 0, failed = 0;
  for(const id of ids){
    const dv = deviceById(id); if(!dv) continue;
    try{
      const blob = await renderDeviceLabelPng(dv);
      zip.file(dv.id+'.png', blob);
      ok++;
    }catch(e){ console.warn('Bild für', id, 'fehlgeschlagen', e); failed++; }
  }
  if(ok===0){ showToast('Es konnten keine Bilder erzeugt werden.'); return; }
  const zipBlob = await zip.generateAsync({type:'blob'});
  const url = URL.createObjectURL(zipBlob);
  const a = document.createElement('a');
  a.href = url; a.download = 'tepm-qr-etiketten-bilder.zip';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast(ok+' Etikettenbild(er) als ZIP exportiert'+(failed?' ('+failed+' fehlgeschlagen)':'')+'.');
}
function exportDymoCsv(){
  const ids = state.qrSelected.size>0 ? Array.from(state.qrSelected) : filteredQrDevices().map(d=>d.id);
  const rows = [['Inventar-ID','Gerät','Typ','Marke','Modell','Benutzer','QR-Inhalt (Link)']];
  ids.forEach(id=>{
    const dv = deviceById(id); if(!dv) return;
    rows.push([dv.id, dv.name, dv.type, dv.brand, dv.model, dv.userName||'', deviceQrText(dv.id)]);
  });
  const csv = rows.map(r=>r.map(cell=>{
    const s = String(cell==null?'':cell);
    return /[",;\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(';')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'tepm-geraete-dymo-export.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast(ids.length+' Gerät(e) als CSV exportiert.');
}

/* Rendert alle .label-qr-Platzhalter innerhalb von containerSelector und liefert ein
   Promise, das erst aufgelöst wird, wenn wirklich alle QR-Codes gezeichnet sind —
   wichtig, damit der Druckdialog nicht mit leeren Etiketten geöffnet wird. */
function paintLabelQrsWithin(containerSelector){
  const holders = Array.from(document.querySelectorAll(containerSelector+' .label-qr'));
  if(!window.QRCodeLib || !window.QRCodeLib.toString){
    holders.forEach(h=> h.innerHTML = '<div class="cell-muted" style="font-size:8px;">QR n/a</div>');
    return Promise.resolve();
  }
  return Promise.all(holders.map(holder=>{
    const id = holder.getAttribute('data-id');
    return window.QRCodeLib.toString(deviceQrText(id), {type:'svg', margin:0, errorCorrectionLevel:'M'}).then(svg=>{
      holder.innerHTML = svg;
      const svgEl = holder.querySelector('svg');
      if(svgEl){ svgEl.style.width='100%'; svgEl.style.height='100%'; svgEl.style.display='block'; }
    }).catch(()=>{ holder.innerHTML = ''; });
  }));
}

const CATEGORY_META = {

  deviceStatus: {title:'Gerätestatus', hint:'Diese Status erscheinen in der Geräteverwaltung (Filter & Bearbeiten-Formular).'},

function countCategoryUsage(listName, value){
  switch(listName){
    case 'deviceTypes': return DEVICES.filter(d=>d.type===value).length;
    case 'deviceStatus': return DEVICES.filter(d=>d.status===value).length;
    case 'userStatus': return USERS.filter(u=>u.status===value).length;
    case 'licenseStatus': return LICENSES.filter(l=>l.status===value).length;
    default: return 0;
  }
}
function addCategoryValue(listName){
  const input = document.getElementById('cat-input-'+listName);
  const value = input.value.trim();
  if(!value) return;
  if(CATEGORY_LISTS[listName].includes(value)){ showToast('„'+value+'" ist bereits vorhanden.'); return; }
  CATEGORY_LISTS[listName].push(value);
  input.value = '';
  render();
  setTimeout(()=>{ const el=document.getElementById('cat-input-'+listName); if(el) el.focus(); }, 30);
}
function removeCategoryValue(listName, value){
  const usage = countCategoryUsage(listName, value);
  const msg = usage>0
    ? `„${value}" wird aktuell von ${usage} Eintrag/Einträgen verwendet. Trotzdem aus der Auswahlliste entfernen? Bestehende Einträge behalten ihren Wert, er lässt sich nur für neue Auswahl nicht mehr auswählen.`
    : `„${value}" wirklich entfernen?`;
  if(!confirm(msg)) return;
  const idx = CATEGORY_LISTS[listName].indexOf(value);
  if(idx > -1) CATEGORY_LISTS[listName].splice(idx, 1);
  render();
}

/* =========================================================
   GERÄT FINDEN — QR-Scan (Kamera) + Code-Eingabe
   ========================================================= */
function openFinderModal(){
  state.modal = {type:'finder', payload:{}};
  state.finderTab = 'code';
  state.finderError = null;
  render();
}
function setFinderTab(tab){
  stopCamera();
  state.finderTab = tab;
  state.finderError = null;
  render();
  if(tab==='scan') startCamera();
}
function resolveDeviceCode(raw){
  if(!raw) return null;
  let code = raw.trim();
  // Falls ein voller QR-Link gescannt wurde: nur den letzten Pfadteil verwenden
  const m = code.match(/([A-Za-z0-9\-]+)\s*$/);
  if(code.includes('/')) code = code.split('/').filter(Boolean).pop();
  code = code.toUpperCase().trim();
  return DEVICES.find(dv=> dv.id.toUpperCase() === code) || null;
}
function submitFinderCode(){
  const val = document.getElementById('finder-code-input').value;
  const dv = resolveDeviceCode(val);
  if(dv){ stopCamera(); openDevice(dv.id); }
  else { state.finderError = 'Kein Gerät mit dem Code „'+escapeHtml(val)+'“ gefunden. Bitte Inventar-ID prüfen (z. B. TEPM-IT-000001).'; render(); document.getElementById('finder-code-input').focus(); }
}
async function startCamera(){
  state.finderError = null;
  const video = document.getElementById('finder-video');
  if(!video) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    state.finderError = 'Kamerazugriff wird von diesem Browser oder dieser Umgebung nicht unterstützt. Bitte den Gerätecode manuell eingeben.';
    render(); return;
  }
  if(!window.jsQR){
    state.finderError = 'Die Scan-Bibliothek konnte nicht geladen werden. Bitte den Gerätecode manuell eingeben.';
    render(); return;
  }
  try{
    // Höhere Auflösung anfragen — hilft der Kamera oft, die schärfere Haupt-/Weitwinkellinse
    // statt einer Ultraweitwinkel-Linse mit schlechterem Nahfokus zu wählen.
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:'environment',
        width:{ideal:1920}, height:{ideal:1080},
      }
    });
    state.cameraStream = stream;
    video.srcObject = stream;
    await video.play();
    state.cameraScanning = true;
    applySoftFocusHint(stream);
    video.oncanplay = null;
    video.onclick = ()=>applySoftFocusHint(stream);
    scanFrame();
  }catch(err){
    state.finderError = 'Kamera konnte nicht gestartet werden (Berechtigung verweigert oder nicht verfügbar). Bitte den Gerätecode manuell eingeben.';
    render();
  }
}
/* Fordert kontinuierlichen Autofokus an, wo der Browser das unterstützt (v. a. Android/Chrome).
   Auf iOS/Safari hat dieser Aufruf keine Wirkung — Apple lässt Web-Apps grundsätzlich keinen
   Kamera-Fokus-Zugriff, das lässt sich technisch nicht umgehen. */
function applySoftFocusHint(stream){
  try{
    const track = stream.getVideoTracks()[0];
    if(!track || !track.getCapabilities) return;
    const caps = track.getCapabilities();
    const advanced = [];
    if(caps.focusMode && caps.focusMode.includes('continuous')) advanced.push({focusMode:'continuous'});
    if(advanced.length) track.applyConstraints({advanced}).catch(()=>{});
  }catch(e){ /* still fine, kein Blocker */ }
}
function stopCamera(){
  state.cameraScanning = false;
  if(state.cameraStream){ state.cameraStream.getTracks().forEach(t=>t.stop()); state.cameraStream = null; }
}
function scanFrame(){
  if(!state.cameraScanning) return;
  const video = document.getElementById('finder-video');
  const canvas = document.getElementById('finder-canvas');
  if(!video || !canvas || video.readyState !== video.HAVE_ENOUGH_DATA){
    requestAnimationFrame(scanFrame); return;
  }
  const ctx = canvas.getContext('2d');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const result = window.jsQR ? window.jsQR(imageData.data, imageData.width, imageData.height) : null;
  if(result && result.data){
    const dv = resolveDeviceCode(result.data);
    if(dv){ stopCamera(); openDevice(dv.id); return; }
  }
  requestAnimationFrame(scanFrame);
}

function closeModal(){ stopCamera(); state.modal=null; render(); }

function selectRole(role){
  if(!ROLE_PASSWORDS[role]){ setRole(role); return; }
  state.modal = {type:'role', payload:{pendingRole:role}};
  render();
  setTimeout(()=>{ const el=document.getElementById('role-password-input'); if(el) el.focus(); }, 30);
}
function confirmRolePassword(role){
  const el = document.getElementById('role-password-input');
  if(el.value === ROLE_PASSWORDS[role]){ setRole(role); }
  else { state.modal = {type:'role', payload:{pendingRole:role, error:'Falsches Passwort.'}}; render(); }
}

function renderModal(){
  const m = state.modal;
  if(m.type==='role') return roleModal(m.payload);
  if(m.type==='qr-view') return qrViewModal(m.payload.id);
  if(m.type==='reassign') return reassignModal(m.payload.id);
  if(m.type==='retire') return retireModal(m.payload.id);
  if(m.type==='device-delete') return deviceDeleteModal(m.payload.id);
  if(m.type==='user-delete') return userDeleteModal(m.payload.id);
  if(m.type==='postpone') return postponeModal(m.payload.id);
  if(m.type==='user-edit') return userEditModal(m.payload.id);
  if(m.type==='assign-licenses') return assignLicensesModal(m.payload.userId);
  if(m.type==='license-edit') return licenseEditModal(m.payload.id);
  if(m.type==='license-delete') return licenseDeleteModal(m.payload.id);
  if(m.type==='procurement-edit') return procurementEditModal(m.payload.index);
  if(m.type==='procurement-delete') return procurementDeleteModal(m.payload.index);
  if(m.type==='device-edit') return deviceEditModal(m.payload.id);
  if(m.type==='label-preview') return labelPreviewModal(m.payload.ids);
  if(m.type==='finder') return finderModal();
  return '';
}

}

/* =========================================================
   NAV / GLOBAL HANDLERS
   ========================================================= */
function pushNavHistory(){
  state.navHistory.push({view: state.view, currentDeviceId: state.currentDeviceId, currentUserId: state.currentUserId});
  if(state.navHistory.length > 40) state.navHistory.shift();
}
function goBack(){
  const prev = state.navHistory.pop();
  if(prev){
    state.view = prev.view;
    state.currentDeviceId = prev.currentDeviceId;
    state.currentUserId = prev.currentUserId;
  } else {
    // Kein Verlauf vorhanden (z. B. Direktaufruf) — sinnvoller Standard je Bereich
    if(state.view==='devices') state.currentDeviceId = null;
    else if(state.view==='users') state.currentUserId = null;
    else state.view = 'dashboard';
  }
  closeModal();
  render(); window.scrollTo(0,0);
}
function goTo(view){
  pushNavHistory();
  closeModal();
  state.view = view; state.currentDeviceId=null; state.currentUserId=null; state.mobileSidebarOpen=false;
  render(); window.scrollTo(0,0);
}
function toggleSidebar(){ state.sidebarCollapsed = !state.sidebarCollapsed; render(); }
function toggleMobileSidebar(){ state.mobileSidebarOpen = !state.mobileSidebarOpen; render(); }
function closeMobileSidebar(){ state.mobileSidebarOpen=false; render(); }
function onSearchInput(val){ state.searchQuery=val; state.searchOpen=true; render(); const el=document.getElementById('global-search'); if(el){ el.focus(); el.setSelectionRange(val.length,val.length);} }

function attachGlobalHandlers(){
  document.addEventListener('click', function(e){
    const searchBox = document.querySelector('.search-box');
    if(searchBox && !searchBox.contains(e.target)){ if(state.searchOpen){ state.searchOpen=false; render(); } }
  }, {once:true});
  paintDeviceQr();
  paintQrGrid();
  if(state.modal && state.modal.type==='qr-view'){ renderQrSvgInto('qr-modal-holder', deviceQrText(state.modal.payload.id)); }
  if(state.modal && state.modal.type==='label-preview'){ paintLabelQrsWithin('#preview-holder'); }
  if(state.modal && state.modal.type==='postpone'){ updatePostponePreview(state.modal.payload.id); }
  if(state.modal && state.modal.type==='finder' && state.finderTab==='scan' && !state.cameraScanning){ startCamera(); }
}

/* Initial render */
render();
</script>
</body>
</html>
